[project]
name = "amail"
version = "0.1.0"
description = "AMail — email triage and auto-reply agent"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "crewai[google-genai,tools]==1.14.2",
    "google-generativeai>=0.8.6",
    "pyqt6>=6.11.0",
    "pywin32>=308; sys_platform == 'win32'",
    "shared-tools",
]

[tool.uv.sources]
shared-tools = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
amail = "amail.main:run"
run_crew = "amail.main:run"
run_triage = "amail.main:run_triage"
extract_style = "amail.main:extract_style"
build_habits = "amail.main:build_habits"
view_habits = "amail.main:view_habits"
view_facts = "amail.main:view_facts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
