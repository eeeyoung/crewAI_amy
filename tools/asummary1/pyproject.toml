[project]
name = "asummary1"
version = "0.1.0"
description = "ASummary1 — Outlook inbox summarizer with Chinese summaries, assignees, todos + GUI"
authors = [{ name = "Yiyang Guan", email = "eeeyoung2001@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.2",
    "google-generativeai>=0.8.6",
    "pyqt6>=6.11.0",
    "pywin32>=308; sys_platform == 'win32'",
    "shared-tools",
]

[tool.uv.sources]
shared-tools = { workspace = true }

[project.scripts]
asummary1 = "asummary1.main:run"
asummary1-gui = "asummary1.gui_viewer:show_summary_window"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
