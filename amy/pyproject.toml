[project]
name = "amy"
version = "0.1.0"
description = "amy using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "crewai[google-genai,tools]==1.14.2",
    "google-generativeai>=0.8.6",
    "pyqt6>=6.11.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
amy = "amy.main:run"
run_crew = "amy.main:run"
train = "amy.main:train"
replay = "amy.main:replay"
test = "amy.main:test"
run_with_trigger = "amy.main:run_with_trigger"
run_triage = "amy.main:run_triage"
extract_style = "amy.main:extract_style"
view_facts = "amy.main:view_facts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
